<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Pisho Notch — Tiny Desktop Cat</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="stage" aria-label="Pisho Notch desktop mascot preview">
    <section class="notch" id="notch" aria-label="Pisho, an animated pair of cat-like eyes">
      <span class="ambient ambient-left"></span>
      <span class="ambient ambient-right"></span>
      <div class="eye eye-left"><span class="iris"><span class="shine"></span></span></div>
      <div class="eye eye-right"><span class="iris"><span class="shine"></span></span></div>
    </section>
    <p class="hint">PISHO <span>·</span> tiny desktop companion</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
