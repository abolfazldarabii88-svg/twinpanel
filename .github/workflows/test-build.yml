name: TwinPanel Windows Test Build (no release)

on:
  push:
    branches-ignore:
      - 'release/v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twinpanel-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/make-icon.js
          node --check scripts/check-inline-scripts.js
          node --check telegram-native/tdlib-service.js
          node --check telegram-native/tdlib-bridge.js
          node scripts/check-inline-scripts.js

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer without publishing
        run: npm run dist:ci

      - name: Upload installer as a test artifact (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: TwinPanel-test-${{ github.run_number }}-${{ github.sha }}
          path: |
            release/TwinPanel-Setup-*.exe
            release/TwinPanel-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
