name: Validate TwinPanel (no publishing)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/**"
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twinpanel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/make-icon.js
          node --check scripts/check-inline-scripts.js
          node --check telegram-native/tdlib-service.js
          node --check telegram-native/gramjs-service.js
          node --check telegram-native/tdlib-bridge.js
          node scripts/check-inline-scripts.js
      - name: Install dependencies and resolve experimental GramJS lockfile
        run: npm install
      - name: Build NSIS installer without publishing
        run: npm run dist:ci
      - name: Upload installer as a short-lived CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinPanel-Windows-CI-${{ github.run_number }}-${{ github.sha }}
          path: |
            release/TwinPanel-Setup-*.exe
            release/TwinPanel-Setup-*.exe.blockmap
            release/latest.yml
            package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit resolved lockfile on experiment branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "package-lock.json is already synchronized."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync experimental GramJS lockfile"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
