name: TwinPanel native Telegram checks

on:
  pull_request:
    branches:
      - 'release/v*'
  push:
    branches:
      - 'feature/telegram-web-parity'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install telethon python-socks
      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/make-icon.js
          node --check scripts/check-inline-scripts.js
          node --check telegram-native/telethon-service.js
          node scripts/check-inline-scripts.js
      - name: Validate Telethon API imports
        run: |
          python -c "from telethon.tl.functions.messages import GetForumTopicsRequest, CreateForumTopicRequest, EditForumTopicRequest, SendVoteRequest, ExportChatlistInviteRequest, GetRecentStickersRequest, SendScheduledMessagesRequest, DeleteHistoryRequest, UpdateDialogFilterRequest, GetScheduledHistoryRequest, DeleteScheduledMessagesRequest, ExportChatInviteRequest, SetTypingRequest, SendMediaRequest"
          python -c "from telethon.tl.functions.account import UpdateNotifySettingsRequest, GetPrivacyRequest, SetPrivacyRequest, GetAuthorizationsRequest, ResetAuthorizationRequest"
          python -c "from telethon.tl.functions.channels import GetFullChannelRequest, GetAdminLogRequest"
          python -c "from telethon.tl.functions.messages import ReportRequest"
          python -c "from telethon.tl.functions.account import ReportPeerRequest"
          python -c "from telethon.tl.functions.contacts import ImportContactsRequest"
          python -c "from telethon.tl.functions.bots import GetBotInfoRequest"
          python -c "from telethon.tl.functions.stories import GetAllStoriesRequest, GetStoriesByIDRequest, ReadStoriesRequest, IncrementStoryViewsRequest"
          python -c "from telethon.tl.types import InputPrivacyKeyStatusTimestamp, InputPrivacyKeyPhoneNumber, InputPrivacyKeyProfilePhoto, InputPrivacyKeyForwards, InputPrivacyKeyChatInvite, InputPrivacyKeyPhoneCall, InputPrivacyValueAllowAll, InputPrivacyValueDisallowAll, InputPrivacyValueAllowContacts, InputPrivacyValueAllowUsers, InputPrivacyValueDisallowUsers, InputPrivacyValueAllowChatParticipants, InputPrivacyValueDisallowChatParticipants, DialogFilter, InputChannel, InputUser, InputPhoneContact, InputDocument, InputMediaDocument, InputChatlistDialogFilter, InputReportReasonSpam, InputReportReasonViolence, InputReportReasonChildAbuse, InputReportReasonIllegalDrugs, InputReportReasonFake, InputReportReasonOther, Poll, PollAnswer, TextWithEntities, InputMediaPoll"
      - name: Validate Telethon bridge syntax
        run: python -m py_compile telegram-native/telethon_bridge.py
