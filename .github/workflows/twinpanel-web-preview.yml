name: TwinPanel Web Preview

on:
  push:
    branches:
      - feature/telegram-native-ui-rebuild
    paths:
      - 'telegram-native/**'
      - '.github/workflows/twinpanel-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: twinpanel-web-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp -R telegram-native/. _site/
          test -s _site/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
