name: Build and publish TwinPanel for Windows

on:
  workflow_dispatch:

concurrency:
  group: twinpanel-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/make-icon.js
          node --check scripts/check-inline-scripts.js
          node --check telegram-native/tdlib-service.js
          node --check telegram-native/tdlib-bridge.js
          node scripts/check-inline-scripts.js
      - name: Install dependencies
        run: npm ci
      - name: Build installer and updater metadata without publishing
        run: npm run dist:ci
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish installer and all updater assets together
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TwinPanel ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/TwinPanel-Setup-*.exe
            release/TwinPanel-Setup-*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
