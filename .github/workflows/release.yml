name: Build and publish TwinPanel for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: twinpanel-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/make-icon.js
          node --check telegram-native/tdlib-service.js
          node --check telegram-native/tdlib-bridge.js
      - name: Install dependencies
        run: npm ci
      - name: Build and publish installer and updater metadata
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
