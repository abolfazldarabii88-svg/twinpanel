name: Build Pisho Notch for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pisho-notch-prototype
    paths:
      - "pisho-notch/**"
      - ".github/workflows/pisho-notch-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Prepare isolated frontend assets
        working-directory: pisho-notch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item index.html, style.css, app.js -Destination dist/

      - name: Build NSIS installer
        working-directory: pisho-notch
        run: tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Pisho-Notch-Windows-Installer
          path: pisho-notch/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
